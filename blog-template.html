<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            line-height: 1.7;
            color: #24292e;
            background-color: #f6f8fa;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            background-color: #fff;
            border: 1px solid #e1e4e8;
            border-radius: 6px;
            padding: 25px 45px 45px 45px;
        }
        .back-link {
            color: #0366d6;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 25px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        h1, h2, h3, h4, h5, h6 {
            margin-top: 24px;
            margin-bottom: 16px;
            font-weight: 600;
            line-height: 1.25;
            border-bottom: 1px solid #eaecef;
            padding-bottom: .3em;
        }
        h1 { font-size: 2em; }
        h2 { font-size: 1.5em; }
        p { margin-top: 0; margin-bottom: 16px; }
        ul, ol {
            padding-left: 2em;
            margin-top: 0;
            margin-bottom: 16px;
        }
        code {
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
            padding: .2em .4em;
            margin: 0;
            font-size: 85%;
            background-color: rgba(27,31,35,.05);
            border-radius: 3px;
        }
        pre {
            word-wrap: normal;
            padding: 16px;
            overflow: auto;
            font-size: 85%;
            line-height: 1.45;
            background-color: #f6f8fa;
            border-radius: 6px;
            margin-bottom: 16px;
        }
        pre code {
            display: inline;
            padding: 0;
            margin: 0;
            overflow: visible;
            line-height: inherit;
            word-wrap: normal;
            background-color: transparent;
            border: 0;
        }
        blockquote {
            margin: 0 0 16px 0;
            padding: 0 1em;
            color: #6a737d;
            border-left: .25em solid #dfe2e5;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">&larr; Back to Portfolio</a>
        <div id="content"><p>Loading post...</p></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const params = new URLSearchParams(window.location.search);
            const postName = params.get('post');
            const contentDiv = document.getElementById('content');
            const pageTitle = document.querySelector('title');

            if (postName) {
                const markdownFile = `blog/${postName}.md`;
                fetch(markdownFile)
                    .then(response => {
                        if (!response.ok) throw new Error(`Network response was not ok: ${response.statusText}`);
                        return response.text();
                    })
                    .then(text => {
                        contentDiv.innerHTML = marked.parse(text);
                        const firstH1 = contentDiv.querySelector('h1');
                        if (firstH1) pageTitle.textContent = firstH1.textContent;
                    })
                    .catch(error => {
                        console.error('Error fetching or parsing markdown:', error);
                        contentDiv.innerHTML = `<h2>Error</h2><p>Sorry, the requested post could not be found.</p>`;
                    });
            } else {
                contentDiv.innerHTML = `<h2>No Post Specified</h2><p>Please select a post from the portfolio page.</p>`;
            }
        });
    </script>
</body>
</html>
